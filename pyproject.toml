[project]
name = "data-challenge-fsml-insea-2026"
version = "0.1.0"
description = "Starter kit for the INSEA 2026 FSML data challenge: how much will the buyer negotiate?"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "matplotlib",
    "kaggle>=2.2.5",
    "jupyterlab",
]

[tool.setuptools]
packages = ["kit"]
